name: Fetch

on:
  schedule:
    - cron: "*/10 * * * *"  # 每 10 分钟执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4

      - name: Run fetch script
        run: python fetch.py

      - name: Commit and push if needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/servers.txt
            git commit -m "Auto update servers.txt"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:master
          else
            echo "No changes to commit."
          fi
