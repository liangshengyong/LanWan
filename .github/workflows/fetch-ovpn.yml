name: Fetch VPNGate OpenVPN Base64

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare data directory
        run: mkdir -p data

      - name: Fetch and extract OpenVPN base64
        run: |
          curl -fsSL https://www.vpngate.net/api/iphone/ -o vpngate.txt

          python3 << 'EOF'
          import csv
          import json
          import sys

          with open("vpngate.txt", "r", encoding="utf-8", errors="ignore") as f:
              lines = [l.strip() for l in f if l.strip() and not l.startswith("*")]

          if not lines:
              print("No CSV data found")
              sys.exit(1)

          reader = csv.DictReader(lines)

          if "OpenVPN_ConfigData_Base64" not in reader.fieldnames:
              print("Columns found:", reader.fieldnames)
              sys.exit(1)

          data = sorted({
              row["OpenVPN_ConfigData_Base64"].strip()
              for row in reader
              if row.get("OpenVPN_ConfigData_Base64")
          })

          with open("data/servers.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Saved {len(data)} OpenVPN configs")
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add data/servers.json
            git commit -m "Update VPNGate OpenVPN configs"
            git push
          fi
