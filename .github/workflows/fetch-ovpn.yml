name: Fetch VPNGate OpenVPN Base64

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare data directory
        run: mkdir -p data

      - name: Fetch and extract OpenVPN base64
        run: |
          curl -fsSL https://www.vpngate.net/api/iphone/ -o vpngate.txt

          python3 << 'EOF'
          import csv
          import json
          import sys

          # 读取并过滤掉注释行（以 * 开头）
          with open("vpngate.txt", "r", encoding="utf-8", errors="ignore") as f:
              lines = [l for l in f if not l.startswith("*")]

          if not lines:
              print("No CSV data found")
              sys.exit(1)

          reader = csv.DictReader(lines)

          if "OpenVPN_ConfigData_Base64" not in reader.fieldnames:
              print("Columns found:", reader.fieldnames)
              print("OpenVPN_ConfigData_Base64 column not found")
              sys.exit(1)

          result = []
          for row in reader:
              val = row.get("OpenVPN_ConfigData_Base64", "").strip()
              if val:
                  result.append(val)

          result = sorted(set(result))

          with open("data/servers.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(result)} OpenVPN configs")
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add data/servers.json
            git commit -m "Update VPNGate OpenVPN configs"
            git push
          fi
