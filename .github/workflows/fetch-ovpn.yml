name: Fetch VPNGate OpenVPN Base64 (10min)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1️⃣ 下载 VPNGate CSV
      - name: Download VPNGate API
        run: |
          curl -sL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv

      # 2️⃣ 提取 OpenVPN_ConfigData_Base64 → JSON
      - name: Extract OpenVPN base64 to JSON
        run: |
          mkdir -p data

          # 找到 OpenVPN_ConfigData_Base64 所在列号
          COL=$(awk -F',' '
            $0 !~ /^\*/ && NR==2 {
              for (i=1;i<=NF;i++) {
                if ($i=="OpenVPN_ConfigData_Base64") {
                  print i
                  exit
                }
              }
            }
          ' /tmp/vpngate.csv)

          if [ -z "$COL" ]; then
            echo "OpenVPN_ConfigData_Base64 column not found"
            exit 1
          fi

          # 提取字段并生成 JSON 数组
          awk -F',' -v col="$COL" '
            # 跳过注释行
            $0 ~ /^\*/ { next }

            # 跳过表头行
            $col == "OpenVPN_ConfigData_Base64" { next }

            # 有效 Base64 数据
            $col ~ /^[A-Za-z0-9+/=]+$/ {
              gsub(/\r/, "", $col)
              print "\"" $col "\""
            }
          ' /tmp/vpngate.csv \
          | sort -u \
          | sed '1s/^/[/' \
          | sed '$s/$/]/' \
          | sed '$!s/$/,/' \
          > /tmp/servers_new.json

      # 3️⃣ 对比是否有变化
      - name: Compare with existing servers.json
        id: diff
        run: |
          if [ -f data/servers.json ]; then
            old_hash=$(sha256sum data/servers.json | cut -d' ' -f1)
            new_hash=$(sha256sum /tmp/servers_new.json | cut -d' ' -f1)

            if [ "$old_hash" = "$new_hash" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "changed
